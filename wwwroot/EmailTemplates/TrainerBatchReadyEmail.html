<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:v="urn:schemas-microsoft-com:vml"
      xmlns:o="urn:schemas-microsoft-com:office:office">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="x-apple-disable-message-reformatting">

    <title>Training Batch Ready</title>

    <link href="https://fonts.googleapis.com/css?family=Roboto:400,600"
          rel="stylesheet"
          type="text/css">

    <style>
        html,
        body {
            margin: 0 auto !important;
            padding: 0 !important;
            height: 100% !important;
            width: 100% !important;
            font-family: 'Roboto', sans-serif !important;
            font-size: 14px;
            color: #8094ae;
            font-weight: 400;
        }

        * {
            -ms-text-size-adjust: 100%;
            -webkit-text-size-adjust: 100%;
            margin: 0;
            padding: 0;
        }

        table,
        td {
            mso-table-lspace: 0pt !important;
            mso-table-rspace: 0pt !important;
        }

        table {
            border-spacing: 0 !important;
            border-collapse: collapse !important;
            table-layout: fixed !important;
            margin: 0 auto !important;
        }

            table table table {
                table-layout: auto;
            }

        a {
            text-decoration: none;
        }

        img {
            -ms-interpolation-mode: bicubic;
        }
    </style>
</head>

<body width="100%"
      style="margin:0; padding:0 !important; background-color:#f5f6fa;">

    <center style="width:100%; background-color:#f5f6fa;">

        <table width="100%"
               border="0"
               cellpadding="0"
               cellspacing="0"
               bgcolor="#f5f6fa">

            <tr>
                <td style="padding:40px 0;">

                    <!-- Header -->
                    <table style="width:100%; max-width:620px; margin:0 auto;">
                        <tbody>
                            <tr>
                                <td style="text-align:center; padding-bottom:25px;">

                                    <a href="{{BaseUrl}}">
                                        <img style="height:60px;"
                                             src="{{BaseUrl}}/assets/images/logo.png"
                                             alt="TSSC Logo">
                                    </a>

                                    <p style="font-size:14px; color:#6576ff; padding-top:12px;">
                                        Telecom Sector Skill Council
                                    </p>

                                </td>
                            </tr>
                        </tbody>
                    </table>

                    <!-- Main Content -->
                    <table style="width:100%; max-width:620px; margin:0 auto; background-color:#ffffff;">
                        <tbody>

                            <tr>
                                <td style="padding:30px 30px 20px;">

                                    <p style="margin-bottom:15px;">
                                        Dear <strong>{{Name}}</strong>, your batch is ready.
                                    </p>

                                    <p style="margin-bottom:15px;">
                                        Training will start from
                                        <strong>{{StartDate}}</strong>.
                                    </p>

                                    <p style="margin-bottom:20px;">
                                        Please check your email or login to the portal
                                        for details on how to attend online training.
                                    </p>

                                    <p style="margin-bottom:20px;">
                                        Regards,<br>
                                        <strong>TSSC Team</strong>
                                    </p>

                                </td>
                            </tr>

                        </tbody>
                    </table>

                    <!-- Footer -->
                    <table style="width:100%; max-width:620px; margin:0 auto;">
                        <tbody>
                            <tr>
                                <td style="text-align:center; padding:25px 20px 0;">

                                    <p style="font-size:13px;">
                                        Copyright © 2026 TSSC INDIA.
                                        All rights reserved.
                                    </p>

                                </td>
                            </tr>
                        </tbody>
                    </table>

                </td>
            </tr>

        </table>

    </center>

</body>
</html>
